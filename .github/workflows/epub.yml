name: Build and deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'tests/**'
      - 'templates/**'
      - 'data/vocabulary/**'
      - 'data/writing/**'
      - 'data/audio/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'Moag-Malayalam-CompleteTextbook.pdf'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'tests/**'
      - 'templates/**'
      - 'data/vocabulary/**'
      - 'data/writing/**'
      - 'data/audio/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'Moag-Malayalam-CompleteTextbook.pdf'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Required unit tests
    uses: ./.github/workflows/unit-tests.yml

  site:
    name: Render HTML with Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Render and validate static HTML
        run: cargo run --locked --release -- site --output dist/site
      - uses: actions/upload-artifact@v4
        with:
          name: malayalam-site
          path: dist/site/
          include-hidden-files: true
          if-no-files-found: error

  epub:
    name: Build and validate EPUB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Pandoc and EPUBCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc default-jre-headless unzip
          curl -fL https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip -o "$RUNNER_TEMP/epubcheck.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
      - name: Check book links and audio removal
        run: cargo test --locked --test publishing portable_book

      - name: Check numbered-list structure
        run: cargo run --locked --release -- check-lists
      - name: Build EPUB from docs
        run: cargo run --locked --release -- epub
      - name: Validate EPUB
        run: java -jar "$RUNNER_TEMP/epubcheck-5.3.0/epubcheck.jar" dist/malayalam.epub
      - uses: actions/upload-artifact@v4
        with:
          name: malayalam-epub
          path: dist/malayalam.epub
          if-no-files-found: error

  pdf:
    name: Build and validate PDF
    runs-on: ubuntu-24.04
    env:
      # The packaged browser has Ubuntu's AppArmor/sandbox configuration;
      # downloaded Chrome for Testing lives outside that configured path.
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native book tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc poppler-utils
          "$CHROME" --version
      - name: Check PDF layout and build the complete book
        run: |
          cargo run --locked --release -- check-pdf-layout
          cargo run --locked --release -- pdf
      - name: Validate searchable PDF, fonts, bookmarks, links, and page bounds
        run: cargo run --locked --release -- check-pdf
      - uses: actions/upload-artifact@v4
        with:
          name: malayalam-pdf
          path: dist/malayalam.pdf
          if-no-files-found: error

  anki:
    name: Build and test Anki
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test APKG identity, templates, and media contracts
        run: cargo test --locked --test publishing
      - name: Build Anki deck
        run: cargo run --locked --release -- anki --no-site-copy
      - uses: actions/upload-artifact@v4
        with:
          name: malayalam-anki
          path: dist/anki/
          if-no-files-found: error

  publish:
    name: Assemble and validate site
    needs: [unit-tests, site, epub, pdf, anki]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: malayalam-site
          path: dist/site/
      - uses: actions/download-artifact@v4
        with:
          name: malayalam-epub
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: malayalam-pdf
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: malayalam-anki
          path: dist/anki/
      - name: Assemble site with book and Anki downloads
        run: |
          mkdir -p dist/site
          cp dist/malayalam.epub dist/site/malayalam.epub
          cp dist/malayalam.pdf dist/site/malayalam.pdf
          cp Moag-Malayalam-CompleteTextbook.pdf dist/site/Moag-Malayalam-CompleteTextbook.pdf
          mkdir -p dist/site/assets/decks
          cp dist/anki/malayalam-moag.apkg dist/site/assets/decks/malayalam-moag.apkg
          cp dist/anki/merged-notes.tsv dist/site/assets/decks/merged-notes.tsv
      - name: Check the assembled site including all downloads
        run: cargo run --locked --release -- check-site --output dist/site --require-exports
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [unit-tests, publish]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
