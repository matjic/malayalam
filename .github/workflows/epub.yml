name: Build EPUB/PDF/Anki and deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'Moag-Malayalam-CompleteTextbook.pdf'
      - 'data/vocabulary/**'
      - 'scripts/build-vocabulary-catalog.py'
      - 'scripts/audio_tables.py'
      - 'scripts/test_vocabulary_ids.py'
      - 'scripts/build-anki.py'
      - 'scripts/anki_export.py'
      - 'scripts/anki.css'
      - 'scripts/test_anki_export.py'
      - 'scripts/test_anki.py'
      - 'requirements/anki*.txt'
      - 'scripts/build-epub.py'
      - 'scripts/book_export.py'
      - 'scripts/build-pdf.py'
      - 'scripts/validate-pdf.py'
      - 'scripts/test_pdf_layout.py'
      - 'scripts/pdf.css'
      - 'scripts/pdf.html'
      - 'requirements/pdf*.txt'
      - 'scripts/test_epub_export.py'
      - 'scripts/check-list-structure.py'
      - 'scripts/reading_order.py'
      - 'scripts/epub.css'
      - '.github/workflows/epub.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'Moag-Malayalam-CompleteTextbook.pdf'
      - 'data/vocabulary/**'
      - 'scripts/build-vocabulary-catalog.py'
      - 'scripts/audio_tables.py'
      - 'scripts/test_vocabulary_ids.py'
      - 'scripts/build-anki.py'
      - 'scripts/anki_export.py'
      - 'scripts/anki.css'
      - 'scripts/test_anki_export.py'
      - 'scripts/test_anki.py'
      - 'requirements/anki*.txt'
      - 'scripts/build-epub.py'
      - 'scripts/book_export.py'
      - 'scripts/build-pdf.py'
      - 'scripts/validate-pdf.py'
      - 'scripts/test_pdf_layout.py'
      - 'scripts/pdf.css'
      - 'scripts/pdf.html'
      - 'requirements/pdf*.txt'
      - 'scripts/test_epub_export.py'
      - 'scripts/check-list-structure.py'
      - 'scripts/reading_order.py'
      - 'scripts/epub.css'
      - '.github/workflows/epub.yml'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  epub:
    name: Build and validate EPUB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pandoc and EPUBCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc default-jre-headless unzip
          curl -fL https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip -o "$RUNNER_TEMP/epubcheck.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
      - name: Check book links and audio removal
        run: python3 scripts/test_epub_export.py
      - name: Check numbered-list structure
        run: python3 scripts/check-list-structure.py
      - name: Build EPUB from docs
        run: python3 scripts/build-epub.py
      - name: Validate EPUB
        run: java -jar "$RUNNER_TEMP/epubcheck-5.3.0/epubcheck.jar" dist/malayalam.epub
      - uses: actions/upload-artifact@v4
        with:
          name: malayalam-epub
          path: dist/malayalam.epub
          if-no-files-found: error

  pdf:
    name: Build and validate PDF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/pdf*.txt
      - name: Install Pandoc and PDF renderer libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Install PDF Python dependencies
        run: python3 -m pip install -r requirements/pdf-test.txt
      - name: Check PDF page layout
        run: python3 scripts/test_pdf_layout.py
      - name: Build PDF from docs
        run: python3 scripts/build-pdf.py
      - name: Validate PDF
        run: python3 scripts/validate-pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: malayalam-pdf
          path: dist/malayalam.pdf
          if-no-files-found: error

  anki:
    name: Build and test Anki
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/anki*.txt
      - name: Install Anki Python dependencies
        run: python3 -m pip install -r requirements/anki-test.txt
      - name: Check vocabulary catalog and persistent IDs
        run: |
          python3 scripts/build-vocabulary-catalog.py --check
          python3 scripts/test_vocabulary_ids.py
      - name: Test Anki validation and import/reimport
        run: |
          python3 scripts/test_anki_export.py
          python3 scripts/test_anki.py
      - name: Build Anki deck
        run: python3 scripts/build-anki.py --no-site-copy
      - uses: actions/upload-artifact@v4
        with:
          name: malayalam-anki
          path: dist/anki/
          if-no-files-found: error

  publish:
    name: Assemble site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [epub, pdf, anki]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: malayalam-epub
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: malayalam-pdf
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: malayalam-anki
          path: dist/anki/
      - name: Assemble site with book and Anki downloads
        run: |
          mkdir -p dist/site
          cp -a docs/. dist/site/
          cp dist/malayalam.epub dist/site/malayalam.epub
          cp dist/malayalam.pdf dist/site/malayalam.pdf
          cp Moag-Malayalam-CompleteTextbook.pdf dist/site/Moag-Malayalam-CompleteTextbook.pdf
          mkdir -p dist/site/assets/decks
          cp dist/anki/malayalam-moag.apkg dist/site/assets/decks/malayalam-moag.apkg
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
