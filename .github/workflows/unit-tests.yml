name: Unit tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    name: Rust tests, source contracts, and compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Check Rust formatting and lints
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Test publishing, source contracts, media, and stable identities
        run: cargo test --locked
      - name: Check source coverage and generated content
        run: |
          cargo run --locked -- check-reading
          cargo run --locked -- vocabulary --check
          cargo run --locked -- glossary --check
          cargo run --locked -- navigation --check
          cargo run --locked -- writing --check
          cargo run --locked -- audit-prompts
      - name: Test backward-compatible fragment redirects
        run: bun test tests/legacy-routes.test.js
