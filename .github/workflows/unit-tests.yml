name: Unit tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust rendering and compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Check Rust formatting and lints
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Test rendered content, links, and assets
        run: cargo test --locked
      - name: Check sidebar freshness
        run: cargo run --locked -- sidebar --check
      - name: Test backward-compatible fragment redirects
        run: bun test tests/legacy-routes.test.js

  python:
    name: Existing content and export checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/anki.txt
      - name: Install exporter dependencies
        run: python3 -m pip install -r requirements/anki.txt
      - name: Run source, coverage, identity, exporter, and audio unit tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_vocabulary*.py' -v
          python3 scripts/test_anki_export.py
          python3 scripts/test_audio_row_alignment.py
      - name: Check generated vocabulary and glossary
        run: |
          python3 scripts/build-vocabulary-catalog.py --check
          python3 scripts/build-vocabulary-glossary.py --check
