[package]
name = "malayalam"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
lol_html = "3"
percent-encoding = "2"
pulldown-cmark = "0.13"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"
walkdir = "2"
sha2 = "0.10"
sha1 = "0.10"
html-escape = "0.2"
unicode-normalization = "0.1"
genanki-rs = "0.4"
tempfile = "3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.25", features = ["bundled"] }
roxmltree = "0.21"
csv = "1"
clap = { version = "4", features = ["derive"] }
ureq = "3"
scraper = "0.24"
tungstenite = "0.28"
base64 = "0.22"
lopdf = "0.38"
