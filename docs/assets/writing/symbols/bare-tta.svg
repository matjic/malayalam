      <path d="M131 43 C98 1 25 11 25 56 C25 76 48 80 76 80" data-part="upper curl" transform="translate(0 0) scale(1)" />
      <path d="M76 80 C139 77 153 137 88 137 C57 137 36 130 27 115" data-part="lower curl" transform="translate(0 0) scale(1)" />
      <path d="M12 4 C22 31 48 31 58 4" data-part="virama" transform="translate(80 -24) scale(1)" />
