<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 270 300" role="img" aria-labelledby="bare-tta-title bare-tta-description" data-source-page="43">
  <title id="bare-tta-title">ട് — writing diagram</title>
  <desc id="bare-tta-description">Redrawn from Moag, PDF page 43. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="bare-tta">
