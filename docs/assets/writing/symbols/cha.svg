<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 360 290" role="img" aria-labelledby="cha-title cha-description" data-source-page="36">
  <title id="cha-title">ച — writing diagram</title>
  <desc id="cha-description">Redrawn from Moag, PDF page 36. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="cha">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
      <path d="M51 100 C23 85 34 53 66 60 C87 64 103 77 104 92" data-part="upper curl" data-movement="1" />
      <path d="M104 92 C110 116 77 129 23 129" data-part="curl and leftward baseline" data-movement="2" />
      <path d="M23 129 H219" data-part="baseline" data-movement="3" />
      <path d="M219 129 V18" data-part="right ascent" data-movement="4" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="cha-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M34 102 C15 70 36 39 79 54" marker-end="url(#cha-arrow)" />
      </g>
      <g data-movement="2">
        <path d="M93 90 C101 107 66 116 30 116" marker-end="url(#cha-arrow)" />
      </g>
      <g data-movement="3">
        <path d="M28 143 H211" marker-end="url(#cha-arrow)" />
      </g>
      <g data-movement="4">
        <path d="M232 129 V26" marker-end="url(#cha-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g data-movement="1">
        <text x="25" y="55" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">1</text>
      </g>
      <g data-movement="2">
        <text x="65" y="111" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">2</text>
      </g>
      <g data-movement="3">
        <text x="114" y="159" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">3</text>
      </g>
      <g data-movement="4">
        <text x="245" y="84" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">4</text>
      </g>
    </g>
