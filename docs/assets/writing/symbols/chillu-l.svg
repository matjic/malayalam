<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 375 330" role="img" aria-labelledby="chillu-l-title chillu-l-description" data-source-page="43">
  <title id="chillu-l-title">ൽ — writing diagram</title>
  <desc id="chillu-l-description">Redrawn from Moag, PDF page 43. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="chillu-l">
