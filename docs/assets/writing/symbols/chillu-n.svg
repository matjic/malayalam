<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 375 320" role="img" aria-labelledby="chillu-n-title chillu-n-description" data-source-page="42">
  <title id="chillu-n-title">ൻ — writing diagram</title>
  <desc id="chillu-n-description">Redrawn from Moag, PDF page 42. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="chillu-n">
