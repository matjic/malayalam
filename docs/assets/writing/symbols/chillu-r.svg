<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -95 315 360" role="img" aria-labelledby="chillu-r-title chillu-r-description" data-source-page="42">
  <title id="chillu-r-title">ർ — writing diagram</title>
  <desc id="chillu-r-description">Redrawn from Moag, PDF page 42. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="chillu-r">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,4)">
      <path d="M45 132 C-9 103 0 18 74 22 C105 23 124 40 131 65" data-part="left arch" data-movement="1" />
      <path d="M131 65 C150 127 125 142 101 132" data-part="right loop descent" data-movement="2" />
      <path d="M101 132 C64 133 62 83 103 50 C135 31 160 15 160 -15" data-part="inner loop and tail ascent" data-movement="3" />
      <path d="M160 -15 C160 -56 119 -57 119 -32" data-part="raised curl" data-movement="4" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="chillu-r-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M26 136 C-37 85 -5 4 78 9" marker-end="url(#chillu-r-arrow)" />
      </g>
      <g data-movement="2">
