<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 290 290" role="img" aria-labelledby="da-title da-description" data-source-page="38">
  <title id="da-title">ദ — writing diagram</title>
  <desc id="da-description">Redrawn from Moag, PDF page 38. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="da">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
      <path d="M45 131 C-9 102 0 20 71 21" data-part="left arch" data-movement="1" />
      <path d="M71 21 C143 14 168 76 87 76" data-part="upper bowl" data-movement="2" />
      <path d="M87 76 C165 71 167 132 87 132" data-part="lower bowl" data-movement="3" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="da-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M27 136 C-34 94 -8 7 56 8" marker-end="url(#da-arrow)" />
      </g>
      <g data-movement="2">
