      <g data-movement="1">
        <circle cx="0" cy="70" r="9" fill="#fff" style="fill:var(--writing-background,#fff)" />
        <text x="0" y="74">1</text>
      </g>
      <g data-movement="2">
        <circle cx="169" cy="48" r="9" fill="#fff" style="fill:var(--writing-background,#fff)" />
        <text x="169" y="52">2</text>
