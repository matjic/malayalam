<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 370 290" role="img" aria-labelledby="dha-title dha-description" data-source-page="38">
  <title id="dha-title">ധ — writing diagram</title>
  <desc id="dha-description">Redrawn from Moag, PDF page 38. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
