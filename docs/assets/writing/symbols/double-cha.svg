<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 375 340" role="img" aria-labelledby="double-cha-title double-cha-description" data-source-page="44">
  <title id="double-cha-title">ച്ച — writing diagram</title>
  <desc id="double-cha-description">Redrawn from Moag, PDF page 44. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="double-cha">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,4)">
      <path d="M51 100 C23 85 34 53 66 60 C87 64 103 77 104 92" data-part="upper curl" data-movement="1" />
      <path d="M104 92 C110 116 77 129 23 129" data-part="curl and leftward baseline" data-movement="2" />
