  <title id="double-la-title">ല്ല — writing diagram</title>
  <desc id="double-la-description">Redrawn from Moag, PDF page 45. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="double-la">
