<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 375 340" role="img" aria-labelledby="double-pa-title double-pa-description" data-source-page="45">
  <title id="double-pa-title">പ്പ — writing diagram</title>
  <desc id="double-pa-description">Redrawn from Moag, PDF page 45. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="double-pa">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
