<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 375 340" role="img" aria-labelledby="double-pa-title double-pa-description" data-source-page="45">
  <title id="double-pa-title">പ്പ — writing diagram</title>
  <desc id="double-pa-description">Redrawn from Moag, PDF page 45. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="double-pa">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,4)">
      <path d="M43 130 C9 112 20 70 55 71 C94 72 106 104 86 127" data-part="left curl" data-movement="1" />
      <path d="M86 127 H222" data-part="baseline" data-movement="2" />
      <path d="M222 127 V20" data-part="right ascent" data-movement="3" />
      <path d="M43 130 C9 112 20 70 55 71 C94 72 106 104 86 127" data-part="left curl" transform="translate(0 69) scale(1)" data-movement="4" />
      <path d="M86 127 H222" data-part="baseline" transform="translate(0 69) scale(1)" data-movement="5" />
      <path d="M222 196 V20" data-part="second ascent" data-movement="6" />
