      <path d="M131 43 C98 1 25 11 25 56 C25 76 48 80 76 80" data-part="upper curl" data-movement="1" />
      <path d="M76 80 C139 77 153 137 88 137 H27" data-part="middle bowl and baseline" data-movement="2" />
      <path d="M27 137 H76 C139 134 153 191 88 191 C57 191 36 184 27 169" data-part="lower bowl" data-movement="3" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="double-tta-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M119 17 C72 -7 19 7 13 45" marker-end="url(#double-tta-arrow)" />
      </g>
      <g data-movement="2">
        <path d="M31 94 C163 75 151 128 65 125" marker-end="url(#double-tta-arrow)" />
      </g>
      <g data-movement="3">
