<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 275 335" role="img" aria-labelledby="double-tta-title double-tta-description" data-source-page="44">
  <title id="double-tta-title">ട്ട — writing diagram</title>
  <desc id="double-tta-description">Redrawn from Moag, PDF page 44. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="double-tta">
