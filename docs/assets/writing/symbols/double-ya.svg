<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 390 340" role="img" aria-labelledby="double-ya-title double-ya-description" data-source-page="45">
  <title id="double-ya-title">യ്യ — writing diagram</title>
  <desc id="double-ya-description">Redrawn from Moag, PDF page 45. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="double-ya">
