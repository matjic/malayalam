<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 470 320" role="img" aria-labelledby="join-ra-title join-ra-description" data-source-page="46">
  <title id="join-ra-title">പ്ര — writing diagram</title>
  <desc id="join-ra-description">Redrawn from Moag, PDF page 46. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="join-ra">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
      <path d="M43 130 C9 112 20 70 55 71 C94 72 106 104 86 127" data-part="left curl" transform="translate(92 0) scale(1)" />
      <path d="M86 127 H222" data-part="baseline" transform="translate(92 0) scale(1)" />
      <path d="M222 127 V20" data-part="right ascent" transform="translate(92 0) scale(1)" />
      <path d="M27 24 V146 C27 174 44 177 69 165" data-part="preposed ra" data-movement="1" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="join-ra-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M14 29 V149 C14 189 38 195 58 187" marker-end="url(#join-ra-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g data-movement="1">
        <text x="0" y="111" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">1</text>
      </g>
    </g>
  </g>
</svg>
