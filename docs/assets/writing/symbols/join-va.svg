<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 495 320" role="img" aria-labelledby="join-va-title join-va-description" data-source-page="46">
  <title id="join-va-title">സ്വ — writing diagram</title>
  <desc id="join-va-description">Redrawn from Moag, PDF page 46. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="join-va">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,4)">
      <path d="M40 131 C-9 105 6 25 58 25 C89 25 105 47 105 73" data-part="left arch" transform="translate(0 0) scale(1)" />
      <path d="M105 73 V130" data-part="middle descent" transform="translate(0 0) scale(1)" />
      <path d="M105 130 V73 C105 11 207 13 207 73" data-part="right arch" transform="translate(0 0) scale(1)" />
      <path d="M207 73 V98 C207 143 270 145 277 103" data-part="right descent" transform="translate(0 0) scale(1)" />
      <path d="M277 103 C290 75 282 44 257 23" data-part="right bowl return" transform="translate(0 0) scale(1)" />
      <path d="M13 136 H70" data-part="joining baseline" transform="translate(286 0) scale(1)" data-movement="1" />
      <path d="M70 136 V25" data-part="joining ascent" transform="translate(286 0) scale(1)" data-movement="2" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="join-va-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g transform="translate(286 0) scale(1)" data-movement="1">
        <path d="M19 151 H62" marker-end="url(#join-va-arrow)" />
      </g>
      <g transform="translate(286 0) scale(1)" data-movement="2">
        <path d="M83 131 V33" marker-end="url(#join-va-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g transform="translate(286 0) scale(1)" data-movement="1">
        <text x="43" y="169" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">1</text>
