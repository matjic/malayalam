<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 350 305" role="img" aria-labelledby="la-title la-description" data-source-page="40">
  <title id="la-title">ല — writing diagram</title>
  <desc id="la-description">Redrawn from Moag, PDF page 40. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="la">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,4)">
      <path d="M31 78 H131" data-part="crossbar" data-movement="1" />
      <path d="M131 78 V47 C131 11 31 11 31 47 V78" data-part="upper arch" data-movement="2" />
      <path d="M31 78 V138" data-part="left descent" data-movement="3" />
      <path d="M31 138 H209" data-part="baseline" data-movement="4" />
      <path d="M209 138 V24" data-part="right ascent" data-movement="5" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="la-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M45 93 H119" marker-end="url(#la-arrow)" />
      </g>
      <g data-movement="2">
        <path d="M144 73 V46 C144 -7 18 -7 18 46 V72" marker-end="url(#la-arrow)" />
      </g>
      <g data-movement="3">
        <path d="M18 88 V130" marker-end="url(#la-arrow)" />
      </g>
      <g data-movement="4">
        <path d="M39 153 H200" marker-end="url(#la-arrow)" />
      </g>
      <g data-movement="5">
        <path d="M222 135 V31" marker-end="url(#la-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g data-movement="1">
        <text x="82" y="112" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">1</text>
      </g>
      <g data-movement="2">
        <text x="74" y="7" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">2</text>
      </g>
      <g data-movement="3">
        <text x="4" y="118" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">3</text>
      </g>
      <g data-movement="4">
        <text x="123" y="172" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">4</text>
      </g>
      <g data-movement="5">
        <text x="237" y="88" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">5</text>
      </g>
    </g>
