<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 290 290" role="img" aria-labelledby="ra-title ra-description" data-source-page="40">
  <title id="ra-title">ര — writing diagram</title>
  <desc id="ra-description">Redrawn from Moag, PDF page 40. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="ra">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
      <path d="M45 132 C-9 103 0 18 74 22 C105 23 124 40 131 65" data-part="left arch" data-movement="1" />
      <path d="M131 65 C150 127 125 142 101 132" data-part="right loop descent" data-movement="2" />
      <path d="M101 132 C62 114 75 57 131 65" data-part="right loop return" data-movement="3" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="ra-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M26 136 C-37 85 -5 4 78 9" marker-end="url(#ra-arrow)" />
      </g>
      <g data-movement="2">
        <path d="M142 40 C174 88 161 129 144 143" marker-end="url(#ra-arrow)" />
      </g>
      <g data-movement="3">
        <path d="M95 118 C68 86 89 61 111 56" marker-end="url(#ra-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g data-movement="1">
        <circle cx="0" cy="65" r="9" fill="#fff" style="fill:var(--writing-background,#fff)" />
        <text x="0" y="69">1</text>
      </g>
      <g data-movement="2">
        <circle cx="173" cy="103" r="9" fill="#fff" style="fill:var(--writing-background,#fff)" />
        <text x="173" y="107">2</text>
      </g>
      <g data-movement="3">
        <circle cx="76" cy="90" r="9" fill="#fff" style="fill:var(--writing-background,#fff)" />
        <text x="76" y="94">3</text>
      </g>
    </g>
  </g>
</svg>
