<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 345 290" role="img" aria-labelledby="sha-title sha-description" data-source-page="40">
  <title id="sha-title">ശ — writing diagram</title>
  <desc id="sha-description">Redrawn from Moag, PDF page 40. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="sha">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
