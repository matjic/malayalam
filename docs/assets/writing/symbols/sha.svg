      <path d="M113 78 V62 C113 5 205 8 209 75" data-part="right arch" data-movement="2" />
      <path d="M209 75 C211 112 193 135 173 135" data-part="right descent" data-movement="3" />
      <path d="M173 135 C124 135 126 82 173 82 C215 82 212 135 173 135" data-part="right loop" data-movement="4" />
    </g>
