<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 225 290" role="img" aria-labelledby="sign-am-title sign-am-description" data-source-page="34">
  <title id="sign-am-title">ം — writing diagram</title>
  <desc id="sign-am-description">Redrawn from Moag, PDF page 34. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="sign-am">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
      <path d="M32 75 C32 42 76 42 76 75 C76 108 32 108 32 75" data-part="anusvara circle" data-movement="1" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="sign-am-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
