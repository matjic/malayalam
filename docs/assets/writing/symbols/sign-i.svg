<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 220 290" role="img" aria-labelledby="sign-i-title sign-i-description" data-source-page="30">
  <title id="sign-i-title">ി — writing diagram</title>
  <desc id="sign-i-description">Redrawn from Moag, PDF page 30. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="sign-i">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,4)">
      <path d="M25 35 C25 7 78 6 78 39 V147" data-part="hook and descent" data-movement="1" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="sign-i-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M37 36 C37 21 66 22 66 39 V140" marker-end="url(#sign-i-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g data-movement="1">
        <text x="58" y="64" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">1</text>
      </g>
    </g>
  </g>
</svg>
