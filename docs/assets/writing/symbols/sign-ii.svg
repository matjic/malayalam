<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 220 290" role="img" aria-labelledby="sign-ii-title sign-ii-description" data-source-page="30">
  <title id="sign-ii-title">ീ — writing diagram</title>
  <desc id="sign-ii-description">Redrawn from Moag, PDF page 30. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="sign-ii">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
      <path d="M40 95 C40 72 72 72 72 95 C72 118 40 118 40 95" data-part="loop" transform="translate(2 -31) scale(0.75)" data-movement="1" />
      <path d="M32 41 C20 6 84 2 84 40 V147" data-part="arch and descent" data-movement="2" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="sign-ii-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
        <marker id="sign-ii-arrow-0" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g transform="translate(2 -31) scale(0.75)" data-movement="1">
        <path d="M46 89 C58 76 68 88 64 100 C60 110 47 105 47 99" marker-end="url(#sign-ii-arrow-0)" />
      </g>
      <g data-movement="2">
        <path d="M35 9 C65 -11 97 6 97 40 V144" marker-end="url(#sign-ii-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g transform="translate(2 -31) scale(0.75)" data-movement="1">
        <text x="56" y="100" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">1</text>
      </g>
      <g data-movement="2">
        <text x="110" y="87" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">2</text>
      </g>
    </g>
  </g>
</svg>
