<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 435 290" role="img" aria-labelledby="sign-o-title sign-o-description" data-source-page="33">
  <title id="sign-o-title">ൊ — writing diagram</title>
  <desc id="sign-o-description">Redrawn from Moag, PDF page 33. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="sign-o">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,4)">
      <path d="M40 95 C40 72 72 72 72 95 C72 118 40 118 40 95" data-part="loop" data-movement="1" />
      <path d="M40 95 C17 12 149 14 133 95 C130 112 118 125 107 131" data-part="outer arch" data-movement="2" />
      <path d="M33 40 C74 -5 119 104 63 128 C42 137 29 126 25 114" data-part="long-a bowl" transform="translate(190 0) scale(1)" data-movement="3" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="sign-o-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
        <marker id="sign-o-arrow-0" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M46 89 C58 76 68 88 64 100 C60 110 47 105 47 99" marker-end="url(#sign-o-arrow-0)" />
      </g>
      <g data-movement="2">
        <path d="M23 87 C8 0 160 1 147 89 C145 107 133 127 121 137" marker-end="url(#sign-o-arrow)" />
      </g>
      <g transform="translate(190 0) scale(1)" data-movement="3">
        <path d="M39 45 C72 21 103 98 66 117 C49 127 40 119 36 114" marker-end="url(#sign-o-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g data-movement="1">
        <text x="56" y="100" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">1</text>
      </g>
      <g data-movement="2">
        <text x="136" y="27" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">2</text>
      </g>
      <g transform="translate(190 0) scale(1)" data-movement="3">
        <text x="93" y="86" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">3</text>
      </g>
    </g>
  </g>
</svg>
