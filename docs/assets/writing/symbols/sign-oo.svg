<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 395 290" role="img" aria-labelledby="sign-oo-title sign-oo-description" data-source-page="33">
  <title id="sign-oo-title">ോ — writing diagram</title>
  <desc id="sign-oo-description">Redrawn from Moag, PDF page 33. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="sign-oo">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,4)">
      <path d="M85 43 C110 43 109 15 85 15 C59 15 62 44 85 43" data-part="upper loop" data-movement="1" />
      <path d="M85 15 C8 6 9 138 82 138" data-part="left arc" data-movement="2" />
      <path d="M82 138 C118 138 109 98 87 104 C69 107 64 126 82 138" data-part="lower loop" data-movement="3" />
      <path d="M33 40 C74 -5 119 104 63 128 C42 137 29 126 25 114" data-part="long-a bowl" transform="translate(150 0) scale(1)" data-movement="4" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="sign-oo-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
        <marker id="sign-oo-arrow-0" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M87 23 C98 21 101 33 91 36 C81 39 75 33 78 27" marker-end="url(#sign-oo-arrow-0)" />
      </g>
      <g data-movement="2">
        <path d="M87 1 C-10 -3 -8 154 69 154" marker-end="url(#sign-oo-arrow)" />
      </g>
      <g data-movement="3">
        <path d="M110 126 C126 100 87 84 73 111" marker-end="url(#sign-oo-arrow)" />
      </g>
      <g transform="translate(150 0) scale(1)" data-movement="4">
        <path d="M39 45 C72 21 103 98 66 117 C49 127 40 119 36 114" marker-end="url(#sign-oo-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g data-movement="1">
        <text x="121" y="33" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">1</text>
      </g>
      <g data-movement="2">
        <text x="4" y="93" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">2</text>
      </g>
      <g data-movement="3">
        <text x="119" y="98" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">3</text>
      </g>
      <g transform="translate(150 0) scale(1)" data-movement="4">
        <text x="93" y="86" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">4</text>
      </g>
    </g>
  </g>
</svg>
