<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 220 290" role="img" aria-labelledby="sign-r-title sign-r-description" data-source-page="31">
  <title id="sign-r-title">ൃ — writing diagram</title>
  <desc id="sign-r-description">Redrawn from Moag, PDF page 31. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="sign-r">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
      <path d="M76 20 C40 18 67 72 74 123" data-part="curved descent" data-movement="1" />
      <path d="M74 123 C63 91 17 110 34 142 C50 170 81 150 74 123" data-part="lower loop" data-movement="2" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="sign-r-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M84 28 C54 27 81 75 86 125" marker-end="url(#sign-r-arrow)" />
      </g>
      <g data-movement="2">
        <path d="M47 160 C9 157 11 103 46 103" marker-end="url(#sign-r-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g data-movement="1">
        <circle cx="101" cy="88" r="9" fill="#fff" style="fill:var(--writing-background,#fff)" />
        <text x="101" y="92">1</text>
      </g>
      <g data-movement="2">
        <circle cx="15" cy="130" r="9" fill="#fff" style="fill:var(--writing-background,#fff)" />
        <text x="15" y="134">2</text>
      </g>
    </g>
  </g>
</svg>
