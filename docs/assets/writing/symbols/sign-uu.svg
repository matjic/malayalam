      <path d="M65 118 C29 118 34 162 65 162" data-part="lower loop left" data-movement="2" />
      <path d="M65 162 C99 162 97 118 65 118" data-part="lower loop right" data-movement="3" />
      <path d="M40 95 C40 72 72 72 72 95 C72 118 40 118 40 95" data-part="loop" transform="translate(29 81) scale(0.53)" data-movement="4" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="sign-uu-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M40 12 C109 -8 79 77 78 108" marker-end="url(#sign-uu-arrow)" />
