<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 230 310" role="img" aria-labelledby="sign-uu-title sign-uu-description" data-source-page="31">
  <title id="sign-uu-title">ൂ — writing diagram</title>
  <desc id="sign-uu-description">Redrawn from Moag, PDF page 31. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="sign-uu">
