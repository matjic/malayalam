<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 415 290" role="img" aria-labelledby="ssa-title ssa-description" data-source-page="40">
  <title id="ssa-title">ഷ — writing diagram</title>
  <desc id="ssa-description">Redrawn from Moag, PDF page 40. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
