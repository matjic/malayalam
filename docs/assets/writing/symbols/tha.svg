<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 350 290" role="img" aria-labelledby="tha-title tha-description" data-source-page="38">
  <title id="tha-title">ത — writing diagram</title>
  <desc id="tha-description">Redrawn from Moag, PDF page 38. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="tha">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
