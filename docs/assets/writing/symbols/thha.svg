<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 370 290" role="img" aria-labelledby="thha-title thha-description" data-source-page="38">
  <title id="thha-title">ഥ — writing diagram</title>
  <desc id="thha-description">Redrawn from Moag, PDF page 38. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="thha">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
      <path d="M28 23 V132" data-part="left descent" data-movement="1" />
      <path d="M28 132 H230" data-part="baseline" data-movement="2" />
      <path d="M230 132 V67 C230 9 121 9 121 67 V132" data-part="right arch" data-movement="3" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="thha-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M15 29 V128" marker-end="url(#thha-arrow)" />
      </g>
      <g data-movement="2">
        <path d="M35 147 H219" marker-end="url(#thha-arrow)" />
      </g>
      <g data-movement="3">
        <path d="M243 119 V66 C243 -7 108 -7 108 66 V116" marker-end="url(#thha-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g data-movement="1">
        <circle cx="4" cy="82" r="9" fill="#fff" style="fill:var(--writing-background,#fff)" />
        <text x="4" y="86">1</text>
      </g>
      <g data-movement="2">
        <circle cx="128" cy="161" r="9" fill="#fff" style="fill:var(--writing-background,#fff)" />
        <text x="128" y="165">2</text>
      </g>
      <g data-movement="3">
        <circle cx="186" cy="8" r="9" fill="#fff" style="fill:var(--writing-background,#fff)" />
        <text x="186" y="12">3</text>
      </g>
    </g>
  </g>
</svg>
