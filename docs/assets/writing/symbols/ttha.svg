<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 255 290" role="img" aria-labelledby="ttha-title ttha-description" data-source-page="37">
  <title id="ttha-title">ഠ — writing diagram</title>
  <desc id="ttha-description">Redrawn from Moag, PDF page 37. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="ttha">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
      <path d="M30 85 C30 30 110 30 110 85 C110 140 30 140 30 85" data-part="oval" data-movement="1" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="ttha-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M42 83 C41 54 100 54 99 85 C97 114 45 115 43 83" marker-end="url(#ttha-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g data-movement="1">
        <text x="71" y="90" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">1</text>
      </g>
    </g>
  </g>
</svg>
