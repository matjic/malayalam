          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
        <marker id="vowel-au-arrow-0" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M46 89 C58 76 68 88 64 100 C60 110 47 105 47 99" marker-end="url(#vowel-au-arrow-0)" />
      </g>
      <g data-movement="2">
        <path d="M24 87 C6 0 156 0 151 62 C151 74 146 81 138 87" marker-end="url(#vowel-au-arrow)" />
