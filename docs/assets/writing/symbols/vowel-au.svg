<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 410 290" role="img" aria-labelledby="vowel-au-title vowel-au-description" data-source-page="29">
  <title id="vowel-au-title">ഔ — writing diagram</title>
  <desc id="vowel-au-description">Redrawn from Moag, PDF page 29. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="vowel-au">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,4)">
      <path d="M40 95 C40 72 72 72 72 95 C72 118 40 118 40 95" data-part="loop" data-movement="1" />
      <path d="M40 95 C15 15 140 11 139 64 C139 78 128 81 111 81" data-part="upper arch and bowl" data-movement="2" />
      <path d="M111 81 C154 81 157 137 114 137 H111" data-part="lower bowl" data-movement="3" />
      <path d="M20 85 V52 C20 24 54 24 54 52 V85" data-part="first arch" transform="translate(172 8) scale(1.1)" data-movement="4" />
      <path d="M54 52 C54 24 88 24 88 52 V110 C88 138 42 138 42 110" data-part="second arch and bowl" transform="translate(172 8) scale(1.1)" data-movement="5" />
    </g>
