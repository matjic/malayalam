<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 280 290" role="img" aria-labelledby="vowel-o-title vowel-o-description" data-source-page="28">
  <title id="vowel-o-title">ഒ — writing diagram</title>
  <desc id="vowel-o-description">Redrawn from Moag, PDF page 28. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="vowel-o">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
      <path d="M40 95 C40 72 72 72 72 95 C72 118 40 118 40 95" data-part="loop" data-movement="1" />
      <path d="M40 95 C15 15 140 11 139 64 C139 78 128 81 111 81" data-part="upper arch and bowl" data-movement="2" />
      <path d="M111 81 C154 81 157 137 114 137 H111" data-part="lower bowl" data-movement="3" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="vowel-o-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
        <marker id="vowel-o-arrow-0" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M46 89 C58 76 68 88 64 100 C60 110 47 105 47 99" marker-end="url(#vowel-o-arrow-0)" />
      </g>
      <g data-movement="2">
        <path d="M24 87 C6 0 156 0 151 62 C151 74 146 81 138 87" marker-end="url(#vowel-o-arrow)" />
      </g>
      <g data-movement="3">
        <path d="M143 92 C166 119 151 149 121 149" marker-end="url(#vowel-o-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g data-movement="1">
        <text x="56" y="100" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">1</text>
      </g>
      <g data-movement="2">
        <text x="105" y="18" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">2</text>
      </g>
      <g data-movement="3">
        <text x="164" y="123" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">3</text>
      </g>
    </g>
  </g>
</svg>
