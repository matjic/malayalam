<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 300 310" role="img" aria-labelledby="vowel-r-title vowel-r-description" data-source-page="28">
  <title id="vowel-r-title">ഋ — writing diagram</title>
  <desc id="vowel-r-description">Redrawn from Moag, PDF page 28. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="vowel-r">
