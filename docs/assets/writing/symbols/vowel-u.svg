<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 290 310" role="img" aria-labelledby="vowel-u-title vowel-u-description" data-source-page="27">
  <title id="vowel-u-title">ഉ — writing diagram</title>
