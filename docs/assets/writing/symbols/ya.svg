<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 380 290" role="img" aria-labelledby="ya-title ya-description" data-source-page="40">
  <title id="ya-title">യ — writing diagram</title>
  <desc id="ya-description">Redrawn from Moag, PDF page 40. Separate centerline paths represent the letter; thin arrows and numbers show writing movements.</desc>
  <g data-symbol="ya">
    <g class="writing-ink" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:var(--writing-stroke-width,8)">
      <path d="M69 23 C-7 14 -14 129 73 132" data-part="left bowl" data-movement="1" />
      <path d="M73 132 C152 132 155 24 120 23" data-part="middle loop up" data-movement="2" />
      <path d="M120 23 C75 21 48 118 143 132" data-part="middle loop down" data-movement="3" />
      <path d="M143 132 C243 147 259 69 214 22" data-part="right bowl" data-movement="4" />
    </g>
    <g class="writing-guides" fill="none" stroke="#557467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--writing-guide-ink,#557467)">
      <defs>
        <marker id="ya-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#557467" stroke-width="1.6" style="stroke:var(--writing-guide-ink,#557467)" />
        </marker>
      </defs>
      <g data-movement="1">
        <path d="M48 9 C-34 30 -27 129 38 146" marker-end="url(#ya-arrow)" />
      </g>
      <g data-movement="2">
        <path d="M85 145 C152 122 165 67 153 26" marker-end="url(#ya-arrow)" />
      </g>
      <g data-movement="3">
        <path d="M104 9 C60 28 56 95 100 120" marker-end="url(#ya-arrow)" />
      </g>
      <g data-movement="4">
        <path d="M181 146 C264 145 278 81 250 30" marker-end="url(#ya-arrow)" />
      </g>
    </g>
    <g class="writing-labels" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#557467" style="fill:var(--writing-guide-ink,#557467)">
      <g data-movement="1">
        <text x="0" y="79" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">1</text>
      </g>
      <g data-movement="2">
        <text x="165" y="76" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">2</text>
      </g>
      <g data-movement="3">
        <text x="76" y="80" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">3</text>
      </g>
      <g data-movement="4">
        <text x="272" y="93" paint-order="stroke fill" stroke="#fff" stroke-width="3" stroke-linejoin="round" style="stroke:var(--writing-background,#fff)">4</text>
      </g>
    </g>
  </g>
</svg>
