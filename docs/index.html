<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Malayalam: A University Course</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Read Rodney F. Moag’s Malayalam course and reference grammar, with linked lessons, grammar sections, glossary, and index.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="assets/vue.css">
  <link rel="stylesheet" href="assets/navigation.css">
  <link rel="stylesheet" href="assets/reading.css">
  <link rel="stylesheet" href="assets/writing.css">
  <link rel="stylesheet" href="assets/footer.css">
  <style>
  body  {
    font-family: 'Noto Sans Malayalam', Source Sans Pro,Helvetica Neue,Arial, sans-serif;
  }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    let docsifyConfig = {
      name: 'Malayalam: A University Course',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      topMargin: 80,
    }
    let hostname = window.location.hostname
    let segments = window.location.pathname.split('/')
    if(
      hostname.endsWith('.github.io')
      && segments.length > 2
      && segments[1].length > 0
    ){
      docsifyConfig.basePath = segments[2]
    }

    window.$docsify = docsifyConfig
  </script>
  <script src="assets/navigation.js"></script>
  <script src="assets/writing.js"></script>
  <script src="assets/footer.js"></script>
  <!-- Docsify v4 -->
  <script src="assets/docsify@4.js"></script>
  <script src="assets/docsify_search.min.js"></script>

</body>
</html>
